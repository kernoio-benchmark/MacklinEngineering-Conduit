services:
  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Dockerfile for Node.js/TypeScript application running with ts-node

        FROM node:18-alpine

        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Copy TypeScript configuration
        COPY tsconfig.json ./

        # Install all dependencies (ts-node needs devDependencies)
        RUN npm ci --ignore-scripts && \
            npm cache clean --force

        # Copy source code and configuration files
        COPY . .

        # Expose port
        EXPOSE 3000

        # Set NODE_ENV to production
        ENV NODE_ENV=production

        # Run the application using node with ts-node/esm loader
        CMD ["node", "--loader", "ts-node/esm", "src/app.ts"]
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:${SECRET}
