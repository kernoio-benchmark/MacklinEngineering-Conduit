version: '3.8'

services:
  couchbase:
    image: couchbase:community-7.2.4
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    environment:
      - CLUSTER_NAME=conduit-cluster
      - COUCHBASE_ADMINISTRATOR_USERNAME=Administrator
      - COUCHBASE_ADMINISTRATOR_PASSWORD=password
      - COUCHBASE_BUCKET=conduit
      - COUCHBASE_BUCKET_RAMSIZE=512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    volumes:
      - couchbase-data:/opt/couchbase/var

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for Node.js TypeScript application

        # Build stage
        FROM node:20-alpine AS builder

        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Copy tsconfig.json for build
        COPY tsconfig.json ./

        # Copy all source code and config files (needed before npm ci due to prepare script)
        COPY src ./src
        COPY config ./config

        # Install all dependencies (including devDependencies for build)
        RUN npm ci

        # Copy remaining files
        COPY . .

        # Build the application
        RUN npm run build

        # Production stage - using ts-node as per npm start
        FROM node:20-alpine AS production

        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Copy tsconfig.json from builder
        COPY --from=builder /app/tsconfig.json ./

        # Install all dependencies (ts-node requires TypeScript and other dev deps)
        RUN npm ci --ignore-scripts && \
            npm cache clean --force

        # Copy source files
        COPY src ./src
        COPY config ./config

        # Copy swagger.yaml from builder
        COPY --from=builder /app/swagger.yaml ./swagger.yaml

        # Set NODE_ENV to production
        ENV NODE_ENV=production

        # Expose port (common default for Node.js apps)
        EXPOSE 3000

        # Run using npm start as documented
        CMD ["node", "--loader", "ts-node/esm", "src/app.ts"]
    depends_on:
      couchbase:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    labels:
      - "jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms"

volumes:
  couchbase-data:
